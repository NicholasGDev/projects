<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g fill="none" stroke="#FF6600" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-20 256 256)">
    <!-- Círculo externo -->
    <circle cx="256" cy="256" r="216" />

    <!-- Eixo vertical -->
    <line x1="256" y1="40" x2="256" y2="472" />

    <!-- Linha do Equador -->
    <line x1="40" y1="256" x2="472" y2="256" />

    <!-- Meridianos (curvas de longitude) -->
